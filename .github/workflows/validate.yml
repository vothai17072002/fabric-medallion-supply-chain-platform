name: Validate architecture controls

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate JSON syntax
        run: |
          python -m json.tool architecture/layer-contracts.json > /dev/null
          python -m json.tool architecture/layer-contracts.schema.json > /dev/null

      - name: Validate layer contract
        run: python scripts/validate_layer_contract.py --require-jsonschema

      - name: Validate public portfolio boundary
        run: python scripts/validate_portfolio.py

      - name: Test fail-closed semantic controls
        run: python -m unittest discover --start-directory tests --verbose

      - name: Compile validator
        run: python -m py_compile scripts/validate_layer_contract.py scripts/validate_portfolio.py
